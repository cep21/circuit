name: Test

permissions:
  # Required: allow read access to the content for analysis.
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  pull-requests: read
  # Optional: Allow write access to checks to allow the action to annotate code in the PR.
  checks: write

on:
  push:
  pull_request:

env:
  # Pinned so new lint rules arrive via a dependency update PR rather than breaking unrelated builds.
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  test:
    strategy:
      matrix:
        # Note: We support the three latest Go versions
        go-version: [1.24.x, 1.25.x, 1.26.x]
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Check out code
        uses: actions/checkout@v7
      - name: Build
        run: make build
      - name: Verify
        run: go mod verify
      - name: Test
        run: make test-race
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: Output coverage
        run: go test -v -covermode=count -coverprofile=coverage.out ./...
      - name: upload coverage
        uses: shogo82148/actions-goveralls@v1
        if: github.ref == 'refs/heads/master' && github.event_name == 'push' && matrix.go-version == '1.26.x'
        with:
          path-to-profile: coverage.out
